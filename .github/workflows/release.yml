name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

jobs:
  build-and-publish:
    if: >-
      github.ref_type == 'tag' ||
      github.event.head_commit.message == 'release: streambus v0.2.2'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Verify package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          package = tomllib.loads(Path("pyproject.toml").read_text())
          assert package["project"]["version"] == "0.2.2"
          PY

      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv build

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 dist/* \
            --target "$GITHUB_SHA" \
            --title "streambus v0.2.2" \
            --notes "Recover idle pending Redis Streams messages via XAUTOCLAIM, with at-least-once delivery and tests."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
