[project]
name = "streambus"
version = "0.2.0"
description = "Lightweight Redis Streams event listener with a clean callback API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jose Meira", email = "jmeiracorbal@gmail.com" }]
keywords = ["redis", "streams", "event-bus", "events", "pubsub", "consumer", "producer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["redis>=5.0"]

[project.urls]
Homepage = "https://github.com/jmeiracorbal/streambus"
Repository = "https://github.com/jmeiracorbal/streambus"
Issues = "https://github.com/jmeiracorbal/streambus/issues"

[dependency-groups]
dev = ["pytest", "pytest-mock", "fakeredis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

